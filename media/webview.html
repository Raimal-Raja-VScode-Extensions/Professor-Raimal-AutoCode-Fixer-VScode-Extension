<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    FIX: added a Content-Security-Policy. Previously there was none, which is
    a known VS Code anti-pattern for webviews with enableScripts: true — it
    logs a warning and gives the page more latitude than it needs. The
    ${cspSource} / ${nonce} placeholders are filled in by extension.ts
    (renderWebviewHtml) each time this file is loaded into the panel. This
    also pins network access to just the CoderAI proxy.
  -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none';
                 img-src ${cspSource} https: data:;
                 style-src 'unsafe-inline' ${cspSource};
                 script-src 'nonce-${nonce}';
                 connect-src https://coder.kvtech.net;">
  <title>CoderAI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: var(--vscode-font-family, 'Segoe UI', sans-serif);
      font-size: 13px;
      background: var(--vscode-editor-background, #1e1e1e);
      color: var(--vscode-editor-foreground, #d4d4d4);
      /*
        FIX: switched from flex (header + flex:1 content) to absolute
        positioning. The flex approach was CSS-correct, but this is the more
        bulletproof pattern for VS Code webviews — it doesn't depend on the
        percentage-height chain from <html> down through the panel's iframe
        actually resolving the way it's supposed to. `position: relative`
        here establishes the containing block that .header and .content
        position against below.
      */
      position: relative;
    }
    .header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 44px;
      background: var(--vscode-titleBar-activeBackground, #323233);
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--vscode-panel-border, #404040);
    }
    .header-icon { font-size: 18px; }
    .header-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--vscode-titleBar-activeForeground, #fff);
    }
    .header-badge {
      font-size: 10px;
      background: rgba(86,156,214,0.2);
      color: #569cd6;
      border: 1px solid rgba(86,156,214,0.3);
      border-radius: 10px;
      padding: 2px 8px;
      font-weight: 600;
    }
    .header-sub {
      font-size: 11px;
      color: var(--vscode-descriptionForeground, #999);
      margin-left: auto;
    }
    /*
      FIX: .content is now absolutely positioned to fill everything below the
      44px header, with its own scroll. Because top/right/bottom/left are all
      pinned, its height is fully deterministic — there's no ambiguity left
      for the browser to get wrong, unlike flex:1 + min-height:0 which
      depends on the flex container itself having a resolved height first.
    */
    .content {
      position: absolute;
      top: 44px; left: 0; right: 0; bottom: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .error-box {
      background: rgba(255,80,80,0.08);
      border: 1px solid rgba(255,80,80,0.3);
      border-left: 3px solid #f44747;
      border-radius: 4px;
      padding: 10px 12px;
    }
    .error-box .label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: #f44747;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .error-box pre {
      font-family: var(--vscode-editor-font-family, 'Courier New', monospace);
      font-size: 11px;
      color: #f48771;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.5;
    }
    .loading {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      color: var(--vscode-descriptionForeground, #999);
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #569cd6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .section {
      background: var(--vscode-editor-inactiveSelectionBackground, rgba(255,255,255,0.04));
      border: 1px solid var(--vscode-panel-border, #404040);
      border-radius: 4px;
      overflow: hidden;
    }
    .section-header {
      padding: 7px 12px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      background: rgba(255,255,255,0.04);
      border-bottom: 1px solid var(--vscode-panel-border, #404040);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .section-header.why { color: #dcdcaa; }
    .section-header.fix { color: #4ec9b0; }
    .section-header.code { color: #569cd6; }
    .section-body {
      padding: 12px;
      line-height: 1.65;
      font-size: 13px;
      color: var(--vscode-editor-foreground, #d4d4d4);
    }
    .code-block {
      position: relative;
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
      overflow: hidden;
    }
    .code-block pre {
      font-family: var(--vscode-editor-font-family, 'Courier New', monospace);
      font-size: 12px;
      padding: 12px;
      overflow-x: auto;
      white-space: pre;
      line-height: 1.6;
      color: #d4d4d4;
      max-height: 350px;
      overflow-y: auto;
    }
    .code-actions {
      display: flex;
      gap: 8px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.2);
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .btn {
      padding: 5px 14px;
      border-radius: 3px;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: opacity 0.15s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #0e639c; color: #fff; }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: var(--vscode-editor-foreground, #d4d4d4);
      border: 1px solid rgba(255,255,255,0.12);
    }
    .type-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .type-code-error { background: rgba(244,71,71,0.2); color: #f44747; }
    .type-dependency { background: rgba(78,201,176,0.2); color: #4ec9b0; }
    .type-other { background: rgba(220,220,170,0.2); color: #dcdcaa; }
    .idle {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 200px;
      gap: 12px;
      color: var(--vscode-descriptionForeground, #888);
      text-align: center;
    }
    .idle-icon { font-size: 36px; opacity: 0.5; }
    .api-error {
      background: rgba(255,140,0,0.08);
      border: 1px solid rgba(255,140,0,0.3);
      border-radius: 4px;
      padding: 12px;
      color: #ce9178;
      line-height: 1.6;
      font-size: 12px;
    }
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,0.25);
      border-radius: 5px;
      border: 2px solid transparent;
      background-clip: padding-box;
    }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); background-clip: padding-box; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">✨</span>
    <span class="header-title">CoderAI</span>
    <span class="header-badge">v3.1.1</span>
    <span class="header-sub">Professor Raimal Raja</span>
  </div>
  <div class="content" id="content">
    <div class="idle">
      <div class="idle-icon">🔍</div>
      <div>Waiting for an error to analyze...</div>
      <div style="font-size:11px">Run your code and I'll detect errors automatically</div>
    </div>
  </div>
  <script nonce="${nonce}">
    const vscode = acquireVsCodeApi();
    // No API key lives here anymore — the extension backend (coder.kvtech.net)
    // holds the real provider key server-side. We only receive a proxy URL.
    let currentCode = '';
    let currentLanguage = 'python';
    // FIX: buttons used to have inline onclick="..." attributes. Our CSP is
    // `script-src 'nonce-${nonce}'` with no 'unsafe-inline' — which is
    // correct and intentional (it's what stops arbitrary injected scripts
    // from running) but it ALSO blocks inline event-handler attributes like
    // onclick, even though the nonce is present on the <script> tag. A nonce
    // only whitelists <script> elements, not onclick/onload/etc attributes —
    // those are a separate thing CSP blocks unconditionally unless
    // 'unsafe-inline' is present, which we deliberately don't add. That's why
    // Apply Fix / Copy / Copy Command rendered but did nothing when clicked.
    // Fix: no inline handlers at all. A single delegated listener (registered
    // here, inside this nonce'd script, which CSP has no objection to) reads
    // data-action from whichever button was clicked. Since it's attached to
    // #content itself (not the buttons), it keeps working every time
    // content.innerHTML is replaced by analyze()/renderResult() below.
    let currentDependencyCommand = '';
    document.getElementById('content').addEventListener('click', (e) => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      if (btn.dataset.action === 'apply-fix') applyFix();
      else if (btn.dataset.action === 'copy-code') copyCode();
      else if (btn.dataset.action === 'copy-dependency') copyDependencyCommand();
    });

    // Tell extension we're ready
    vscode.postMessage({ command: 'ready' });

    // Receive messages from extension
    window.addEventListener('message', async (event) => {
      const msg = event.data;
      if (msg.command === 'analyze') {
        await analyze(msg.errorText, msg.fileInfo, msg.fileCode, msg.proxyUrl, msg.model);
      }
    });

    async function analyze(errorText, fileInfo, fileCode, proxyUrl, model) {
      const content = document.getElementById('content');

      // Detect language from file info
      if (fileInfo.includes('.py') || fileInfo.includes('python')) currentLanguage = 'python';
      else if (fileInfo.includes('.js') || fileInfo.includes('javascript')) currentLanguage = 'javascript';
      else if (fileInfo.includes('.ts') || fileInfo.includes('typescript')) currentLanguage = 'typescript';
      else if (fileInfo.includes('.java')) currentLanguage = 'java';
      else if (fileInfo.includes('.cpp') || fileInfo.includes('.c')) currentLanguage = 'cpp';
      else if (fileInfo.includes('.cs')) currentLanguage = 'csharp';
      else currentLanguage = 'code';

      const truncatedError = errorText.substring(0, 2000);
      const truncatedCode = fileCode ? fileCode.substring(0, 1500) : '';

      content.innerHTML = `
        <div class="error-box">
          <div class="label">⚡ Error Detected</div>
          <pre>${escapeHtml(truncatedError)}</pre>
        </div>
        <div class="loading">
          <div class="spinner"></div>
          <span>CoderAI is analyzing your error with Professor-Raimal...</span>
        </div>
      `;

      try {
        // The proxy is expected to return EXACTLY this JSON shape:
        // {
        //   "errorType": "code_error" | "dependency_error" | "configuration_error" | "permission_error" | "other",
        //   "errorTitle": "...",
        //   "whyItHappened": "...",
        //   "howToFix": "step 1\\nstep 2\\n...",
        //   "fixedCode": "...",
        //   "dependencyCommand": "...",
        //   "severity": "low" | "medium" | "high"
        // }
        // Your PHP proxy is responsible for calling the underlying LLM
        // (Professor-Raimal) and normalizing its output to this shape.
        const response = await fetch(proxyUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: model || 'Professor-Raimal',
            errorText: truncatedError,
            fileCode: truncatedCode,
            fileInfo: fileInfo,
            language: currentLanguage
          })
        });

        if (!response.ok) {
          let errMsg = `HTTP ${response.status}`;
          try {
            const errData = await response.json();
            errMsg = errData.error?.message || errData.message || errMsg;
          } catch (_) { /* body wasn't JSON, keep default message */ }
          throw new Error(errMsg);
        }

        const result = await response.json();

        currentCode = result.fixedCode || '';
        renderResult(result, truncatedError);
      } catch (err) {
        content.innerHTML = `
          <div class="error-box">
            <div class="label">⚡ Error Detected</div>
            <pre>${escapeHtml(truncatedError)}</pre>
          </div>
          <div class="api-error">
            <strong>⚠️ Could not reach CoderAI backend</strong><br><br>
            ${escapeHtml(err.message)}<br><br>
            <strong>Possible causes:</strong><br>
            • No internet connection<br>
            • coder.kvtech.net is temporarily down<br>
            • Backend rate limit reached<br>
            • Firewall blocking the request
          </div>
        `;
      }
    }

    function renderResult(r, originalError) {
      const content = document.getElementById('content');
      const badgeClass = r.errorType === 'dependency_error' ? 'type-dependency'
                       : r.errorType === 'code_error' ? 'type-code-error'
                       : 'type-other';
      const badgeLabel = r.errorType?.replace(/_/g, ' ') || 'error';
      const severityColor = r.severity === 'high' ? '#f44747'
                          : r.severity === 'medium' ? '#dcdcaa'
                          : '#4ec9b0';

      let fixSteps = (r.howToFix || 'No fix available.')
        .split('\\n')
        .filter(s => s.trim())
        .map((s, i) => `<div style="margin-bottom:6px"><span style="color:#569cd6;font-weight:600;">${i+1}.</span> ${escapeHtml(s)}</div>`)
        .join('');

      let codeSection = '';
      if (r.fixedCode && r.fixedCode.trim()) {
        codeSection = `
          <div class="section">
            <div class="section-header code">
              <span>💻</span> Fixed Code
            </div>
            <div class="code-block">
              <pre id="codeBlock">${escapeHtml(r.fixedCode)}</pre>
              <div class="code-actions">
                <button class="btn btn-primary" data-action="apply-fix">⚡ Apply Fix to File</button>
                <button class="btn btn-secondary" data-action="copy-code">📋 Copy</button>
              </div>
            </div>
          </div>
        `;
      }

      let depSection = '';
      if (r.dependencyCommand && r.dependencyCommand.trim()) {
        // Store raw value in JS, not in an interpolated HTML attribute (see note above).
        currentDependencyCommand = r.dependencyCommand;
        depSection = `
          <div class="section">
            <div class="section-header fix">
              <span>📦</span> Install Required Package
            </div>
            <div class="section-body">
              <div class="code-block">
                <pre>${escapeHtml(r.dependencyCommand)}</pre>
                <div class="code-actions">
                  <button class="btn btn-secondary" data-action="copy-dependency">📋 Copy Command</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      content.innerHTML = `
        <div class="error-box">
          <div class="label" style="display:flex;align-items:center;justify-content:space-between;">
            <span>⚡ Error Detected</span>
            <span style="color:${severityColor};font-size:10px;font-weight:600;">${(r.severity || 'medium').toUpperCase()} SEVERITY</span>
          </div>
          <div style="margin-bottom:6px;margin-top:2px;">
            <span style="font-size:13px;font-weight:600;color:#f48771;">${escapeHtml(r.errorTitle || 'Unknown Error')}</span>
            &nbsp;<span class="type-badge ${badgeClass}">${escapeHtml(badgeLabel)}</span>
          </div>
        </div>
        <div class="section">
          <div class="section-header why">
            <span>🔍</span> Why This Happened
          </div>
          <div class="section-body">${escapeHtml(r.whyItHappened || 'No explanation available.')}</div>
        </div>
        <div class="section">
          <div class="section-header fix">
            <span>🛠️</span> How To Fix It
          </div>
          <div class="section-body">${fixSteps}</div>
        </div>
        ${depSection}
        ${codeSection}
      `;
    }

    function applyFix() {
      vscode.postMessage({ command: 'applyFix', code: currentCode, language: currentLanguage });
    }
    function copyCode() {
      const block = document.getElementById('codeBlock');
      if (block) {
        vscode.postMessage({ command: 'copyToClipboard', text: block.textContent });
      }
    }
    function copyDependencyCommand() {
      vscode.postMessage({ command: 'copyToClipboard', text: currentDependencyCommand });
    }
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
